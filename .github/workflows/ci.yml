# CI for anoikis-tools: the harness-agnostic work-graph engine binary.
#
# go.mod `replace`s onto ../ai-shared-lib/go/* and ../ai-shared-lib/plugin-foundation (see
# release.yml's header). actions/checkout refuses any path outside $GITHUB_WORKSPACE, so
# every job that runs `go build`/`go vet`/`go test` checks out both repos as workspace
# siblings (anoikis-tools, ai-shared-lib) and runs with working-directory: anoikis-tools,
# which resolves the replace target at ../ai-shared-lib exactly as a local dev checkout
# does. claude-shared-tooling is private, so the sibling checkout needs read access via
# SIBLING_REPO_TOKEN (a PAT scoped to that repo) rather than the default, repo-scoped
# GITHUB_TOKEN.
#
# guardrail gates every other job: SC-VERSIONING (tag-prefix.sh, tag pushes only) and
# SC-DISTRIBUTION (no-committed-binaries.sh, every run) -- see release/guard/README.md.

name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z) fires the workflow so tag-prefix.sh runs at tag-push time.
    tags: ['*']
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  guardrail:
    name: guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No committed binaries (SC-DISTRIBUTION)
        run: bash release/guard/no-committed-binaries.sh .

      - name: Tag conforms to SC-VERSIONING
        if: startsWith(github.ref, 'refs/tags/')
        run: bash release/guard/tag-prefix.sh "${GITHUB_REF_NAME}"

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    needs: guardrail
    defaults:
      run:
        working-directory: anoikis-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: anoikis-tools

      - name: Checkout ai-shared-lib sibling (go.mod replace target)
        uses: actions/checkout@v5
        with:
          repository: johnrichter/claude-shared-tooling
          token: ${{ secrets.SIBLING_REPO_TOKEN }}
          path: ai-shared-lib

      - uses: actions/setup-go@v5
        with:
          go-version-file: anoikis-tools/go.mod

      - name: gofmt --check
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -trimpath -ldflags='-s -w' -o /dev/null .

      - name: go test
        run: go test ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
        with:
          path: anoikis-tools

      - name: Checkout ai-shared-lib sibling (go.mod replace target)
        uses: actions/checkout@v5
        with:
          repository: johnrichter/claude-shared-tooling
          token: ${{ secrets.SIBLING_REPO_TOKEN }}
          path: ai-shared-lib

      - uses: actions/setup-go@v5
        with:
          go-version-file: anoikis-tools/go.mod

      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.12.2
          working-directory: anoikis-tools
